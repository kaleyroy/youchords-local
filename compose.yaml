services:
  companion:
    build:
      context: ./apps/local-companion
    environment:
      YOUCHORDS_PAIRING_TOKEN: ${YOUCHORDS_PAIRING_TOKEN:?Run install.ps1 to create the pairing token}
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    volumes:
      - youchords-data:/data

volumes:
  youchords-data:
